# End-to-end: run the real dya-studio in a headless browser and have it fully
# connect to real ZMK firmware running in the Renode emulator over (a shim of)
# the WebSerial API -- no hardware. The DUT is the exact hardware-flashable
# studio-rpc-usb-uart image; Studio RPC rides the emulated USB CDC (NRF_USBD_Full
# + DualCdcAcmBridge from zmk-west-commands), which drains large replies, so the
# app reaches the fully-connected screen. See e2e/renode/README.md for the
# architecture and e2e/renode/firmware/README.md for the DUT build recipes.
#
# Structure: a `matrix` job emits the DUT firmware list (single source of truth);
# `build-dut` fans out over it to build each real image from its own repo/branch;
# `e2e` fans out over the same list to run that DUT's scoped Playwright specs
# against it. Each DUT entry carries its build source AND the spec set it runs:
#   tests/common  - the generic connect proof (every DUT)
#   tests/official - the renode_tester Keymap-tab behaviors (official DUT only)
#   tests/dya2    - the dya2 per-tab specs (dya2 DUT only; the fan-out target)
# Adding a new DUT is a one-entry edit to that list.
#
# Opt-in / path-scoped so it never burdens ordinary PRs (each firmware build is a
# full Zephyr build, ~15-20 min cold).
name: renode-webserial-e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "e2e/renode/**"
      - ".github/workflows/renode-webserial-e2e.yml"
      # The developer-guide captures run against the built-in demo keyboard and
      # do not exercise Renode or firmware. Do not schedule the 15–20 minute
      # firmware matrix when a PR changes only this documentation workflow.
      - "!e2e/renode/tests/developer-guide-screenshots.spec.ts"
      - "!e2e/renode/capture-developer-guide.sh"

env:
  # cormoran/zmk-west-commands provides the Renode harness (run side). The DUT
  # build source is per-entry in the matrix (`repo`/`ref`/`manifest`/`build`).
  ZMK_WC_REPO: cormoran/zmk-west-commands
  ZMK_WC_REF: main

jobs:
  # Single source of truth for the DUT firmware matrix, consumed by both
  # build-dut and e2e via fromJSON. Each entry:
  #   id       - stable slug (artifact name + matrix label)
  #   repo/ref - the config repo + branch the DUT firmware is built from
  #   manifest - west init -l manifest (relative to that repo)
  #   keymap_overlay - ("" = none) a keymap file vendored in THIS repo (path
  #              relative to the dya-studio repo root) that build-dut copies over
  #              the DUT config repo's renode_tester shield keymap before build,
  #              so the DUT ships that keymap. official-unlocked uses the
  #              4-layer renode_tester_multilayer.keymap (Base/Lower/Raise/Adjust)
  #              so the layer-management specs have >=2 layers to work with.
  #   build    - the `west zmk-build ...` invocation (its cmake-args merged in)
  #   elf      - path (relative to the west topdir) of the produced zmk.elf
  #   peripheral_build - ("" = none) a second `west zmk-build ...` for a wired
  #              split PERIPHERAL half; when set, renode_serve.py boots TWO
  #              machines (central + this peripheral, uart0 split links
  #              cross-connected) so the central's wired-split link has a peer
  #              and enumerates USB. dya2 needs this (see firmware/README.md).
  #   peripheral_elf - path of the peripheral zmk.elf (forwarded as
  #              DYA2_PERIPHERAL_ELF); "" when peripheral_build is "".
  #   device   - the name the DUT advertises via GetDeviceInfo (DEVICE_NAME)
  #   platform - RENODE_PLATFORM for renode_serve.py ("" = harness USB platform,
  #              "dya2" = vendored USB+PMW3610 trackball platform)
  #   specs    - the Playwright spec dirs/files this DUT runs in ONE Renode boot
  #              (passed to run-local.sh). Ordering is Playwright's path sort.
  #   destructive_specs - ("" = none) specs that WIPE device state (NVS) and so
  #              must run in their OWN fresh Renode boot, after the main `specs`
  #              run. official-unlocked runs reset.spec.ts here: it persists a
  #              keymap edit then factory-resets, which would corrupt the other
  #              official specs if they shared its boot (and it must not follow
  #              keymap.spec, which persists an A->F edit). The e2e job invokes
  #              run-local.sh a SECOND time for these (a second boot).
  #   one_connection_per_boot - true => this DUT serves only ONE Studio
  #              connection per Renode boot (a second connect desyncs on buffered
  #              bytes), so the e2e job runs EACH spec in its own fresh boot
  #              instead of one boot for the whole `specs` set. dya2 (two-machine
  #              wired split) needs this; official does not. See firmware/README
  #              ("Per-boot execution") and tests/dya2/dya2.helpers.ts.
  #   experimental - true => the e2e job is allowed to fail (continue-on-error).
  #              The build still runs+gates; used for a DUT with a known e2e
  #              blocker so it fans out without turning the whole workflow red.
  # The three DUTs (all STUDIO_LOCKING=n so they boot UNLOCKED -- the tabs need
  # the keymap/subsystems served and there is no RPC unlock plumbing here):
  #   - official-unlocked (gating): the exact zmkfirmware/zmk studio-rpc-usb-uart
  #     image, renode_tester shield -- proves dya-studio works with upstream ZMK.
  #   - dya2-unlocked (EXPERIMENTAL, dispatch-only): the real dya2
  #     right_trackball_studio_unlocked artifact (the FULL fork feature set), a
  #     two-machine WIRED SPLIT. Its e2e is gated to workflow_dispatch because the
  #     two-machine emulation cannot wire USB CDC on a stock GitHub runner (the
  #     two CPU threads starve; verified -- never enumerates even with a 10-min
  #     wiring timeout). Its firmware still builds+gates on every PR.
  #   - dya2-nonsplit-unlocked (GATING): the SAME dya2 fork feature set built
  #     NON-SPLIT (CONFIG_ZMK_SPLIT=n via a vendored overlay/conf), so it boots as
  #     a SINGLE machine and wires USB CDC reliably like the official DUT. It runs
  #     the same tests/dya2 specs, giving the fork feature set real CI coverage on
  #     stock runners. See e2e/renode/firmware/dya2_nonsplit.{overlay,conf}.
  matrix:
    name: Compute DUT matrix
    runs-on: ubuntu-latest
    outputs:
      # duts: every DUT (build-dut fans out over this -- all firmware builds on
      # every PR). e2e_duts: the DUTs whose e2e runs for THIS event -- all on
      # manual dispatch, but only non-experimental ones on push/PR (the two-machine
      # dya2-unlocked emulation can't wire USB CDC on a stock runner, so its e2e
      # would only ever go red; it stays runnable via workflow_dispatch / a beefier
      # runner, and its firmware still builds. The single-machine
      # dya2-nonsplit-unlocked DUT is NOT experimental and gates on every PR).
      duts: ${{ steps.set.outputs.duts }}
      e2e_duts: ${{ steps.set.outputs.e2e_duts }}
    steps:
      - id: set
        run: |
          cat >duts.json <<'JSON'
          [
            {
              "id": "official-unlocked",
              "repo": "cormoran/zmk-west-commands",
              "ref": "main",
              "manifest": "scripts/west-test-standalone.yml",
              "keymap_overlay": "e2e/renode/firmware/renode_tester_multilayer.keymap",
              "build": "west zmk-build tests/zmk-config --build-yaml tests/zmk-config/build-ble.yaml --cmake-args ' -DCONFIG_ZMK_STUDIO_LOCKING=n' -af ble -d build",
              "elf": "build/ble/zephyr/zmk.elf",
              "peripheral_build": "",
              "peripheral_elf": "",
              "device": "Renode",
              "platform": "",
              "specs": "tests/common tests/official/keymap-layers.spec.ts tests/official/keymap.spec.ts",
              "destructive_specs": "tests/official/reset.spec.ts",
              "one_connection_per_boot": false,
              "experimental": false
            },
            {
              "id": "dya2-unlocked",
              "repo": "cormoran/zmk-keyboard-dya2",
              "ref": "main",
              "manifest": "config/west-workspace.yml",
              "keymap_overlay": "",
              "build": "west zmk-build config -af right_trackball_studio_unlocked -d build",
              "elf": "build/right_trackball_studio_unlocked/zephyr/zmk.elf",
              "peripheral_build": "west zmk-build config -af left -d build",
              "peripheral_elf": "build/left/zephyr/zmk.elf",
              "device": "DYA2",
              "platform": "dya2",
              "specs": "tests/common tests/dya2",
              "destructive_specs": "",
              "one_connection_per_boot": true,
              "experimental": true
            },
            {
              "id": "dya2-nonsplit-unlocked",
              "repo": "cormoran/zmk-keyboard-dya2",
              "ref": "main",
              "manifest": "config/west-workspace.yml",
              "keymap_overlay": "",
              "build": "west zmk-build config -b xiao_ble//zmk -s dya2_right -S studio-rpc-usb-uart right-trackball -a nonsplit --cmake-args \"-DCONFIG_ZMK_STUDIO_LOCKING=n -DEXTRA_DTC_OVERLAY_FILE=$GITHUB_WORKSPACE/_overlay-src/e2e/renode/firmware/dya2_nonsplit.overlay -DEXTRA_CONF_FILE=$GITHUB_WORKSPACE/_overlay-src/e2e/renode/firmware/dya2_nonsplit.conf\" -d build",
              "elf": "build/nonsplit__xiao_ble__zmk__dya2_right/zephyr/zmk.elf",
              "peripheral_build": "",
              "peripheral_elf": "",
              "device": "DYA2",
              "platform": "dya2",
              "specs": "tests/common tests/dya2",
              "destructive_specs": "",
              "one_connection_per_boot": true,
              "experimental": false
            }
          ]
          JSON
          echo "duts=$(jq -c . duts.json)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "e2e_duts=$(jq -c . duts.json)" >> "$GITHUB_OUTPUT"
          else
            echo "e2e_duts=$(jq -c '[.[] | select(.experimental == false)]' duts.json)" >> "$GITHUB_OUTPUT"
          fi

  build-dut:
    name: Build DUT (${{ matrix.dut.id }})
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        dut: ${{ fromJSON(needs.matrix.outputs.duts) }}
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - name: Checkout DUT config repo
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.dut.repo }}
          ref: ${{ matrix.dut.ref }}
      # Vendored build inputs (the multi-layer keymap overlay for official, and
      # the non-split overlay/conf for dya2-nonsplit) live in THIS (dya-studio)
      # repo, not the DUT config repo, so check it out into a side path. Needed
      # whenever a DUT sets keymap_overlay or its build references _overlay-src
      # (via -DEXTRA_DTC_OVERLAY_FILE / -DEXTRA_CONF_FILE).
      - name: Checkout dya-studio (vendored build inputs)
        if: matrix.dut.keymap_overlay != '' || contains(matrix.dut.build, '_overlay-src')
        uses: actions/checkout@v5
        with:
          path: _overlay-src
      - name: Overlay multi-layer keymap onto renode_tester shield
        if: matrix.dut.keymap_overlay != ''
        run: |
          cp "_overlay-src/${{ matrix.dut.keymap_overlay }}" \
             tests/zmk-config/boards/shields/renode_tester/renode_tester.keymap
          echo "renode_tester.keymap now:"
          cat tests/zmk-config/boards/shields/renode_tester/renode_tester.keymap
      - name: West init/update
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          west init -l . --mf ${{ matrix.dut.manifest }}
          west update --narrow
          west zephyr-export
      - name: Build DUT (real studio-rpc-usb-uart image)
        run: ${{ matrix.dut.build }}
      - name: Upload DUT ELF
        uses: actions/upload-artifact@v4
        with:
          name: dut-elf-${{ matrix.dut.id }}
          path: ${{ matrix.dut.elf }}
      # Wired-split DUTs (dya2) also build a PERIPHERAL half; the e2e boots it as
      # the second machine so the central's wired-split link has a peer.
      - name: Build DUT peripheral (wired-split half)
        if: matrix.dut.peripheral_build != ''
        run: ${{ matrix.dut.peripheral_build }}
      - name: Upload DUT peripheral ELF
        if: matrix.dut.peripheral_build != ''
        uses: actions/upload-artifact@v4
        with:
          name: dut-elf-${{ matrix.dut.id }}-peripheral
          path: ${{ matrix.dut.peripheral_elf }}

  e2e:
    name: e2e (${{ matrix.dut.id }})
    needs: [matrix, build-dut]
    runs-on: ubuntu-latest
    # 40 min covers the dya2-nonsplit per-boot path (connect + 7 dya2 specs, one
    # fresh Renode boot each at ~1.5-2 min on a stock runner).
    timeout-minutes: 40
    # The e2e fans out over e2e_duts (the matrix job filters experimental DUTs out
    # on push/PR, keeping them on workflow_dispatch) -- so the two-machine
    # dya2-unlocked DUT, whose heavy emulation can't wire USB CDC on a stock
    # runner, never turns a PR red. The single-machine dya2-nonsplit-unlocked DUT
    # (experimental: false) DOES gate: it wires reliably like the official DUT.
    # continue-on-error still guards a slow experimental dispatch run.
    continue-on-error: ${{ matrix.dut.experimental }}
    strategy:
      fail-fast: false
      matrix:
        dut: ${{ fromJSON(needs.matrix.outputs.e2e_duts) }}
    steps:
      - name: Checkout dya-studio
        uses: actions/checkout@v5

      - name: Build dya-studio dist
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /

      - name: Checkout zmk-west-commands (Renode harness)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ZMK_WC_REPO }}
          ref: ${{ env.ZMK_WC_REF }}
          path: zmk-west-commands
      - name: Install Renode 1.16.1
        run: bash zmk-west-commands/scripts/lib/renode/install_renode.sh

      - name: Download DUT ELF
        uses: actions/download-artifact@v4
        with:
          name: dut-elf-${{ matrix.dut.id }}
          path: fw
      - name: Download DUT peripheral ELF (wired split)
        if: matrix.dut.peripheral_build != ''
        uses: actions/download-artifact@v4
        with:
          name: dut-elf-${{ matrix.dut.id }}-peripheral
          path: fw-peripheral

      - name: Install e2e deps (Playwright + ws)
        working-directory: e2e/renode
        run: |
          npm install
          npx playwright install --with-deps chromium

      # Single-boot DUTs (official): run all of `specs` in ONE Renode boot.
      # run-local.sh forwards its extra args to `playwright test`, so the DUT's
      # `specs` dirs select exactly the specs valid for this DUT in one boot
      # (tests/common for all; tests/official per DUT).
      - name: Run WebSerial ⇄ Renode e2e (single Renode boot)
        if: ${{ !matrix.dut.one_connection_per_boot }}
        working-directory: e2e/renode
        env:
          ZMK_WC_RENODE_LIB: ${{ github.workspace }}/zmk-west-commands/scripts/lib/renode
          DIST_DIR: ${{ github.workspace }}/dist
          DEVICE_NAME: ${{ matrix.dut.device }}
          RENODE_PLATFORM: ${{ matrix.dut.platform }}
          # When the DUT has a wired-split peripheral, forward it so renode_serve
          # boots two machines (central + peripheral, uart0 links cross-connected).
          DYA2_PERIPHERAL_ELF: ${{ matrix.dut.peripheral_build != '' && format('{0}/fw-peripheral/zmk.elf', github.workspace) || '' }}
        run: bash run-local.sh "${{ github.workspace }}/fw/zmk.elf" ${{ matrix.dut.specs }}

      # Per-boot DUTs run EACH spec in its OWN fresh Renode boot (run-local.sh
      # boots one Renode per invocation). Two per-boot DUTs use this:
      #   - dya2-unlocked (two-machine wired split): serves only ONE Studio
      #     connection per boot, so specs cannot share a boot. (experimental /
      #     dispatch-only: its emulation can't wire USB CDC on a stock CI runner.)
      #   - dya2-nonsplit-unlocked (single machine): CAN serve many connections
      #     per boot, but its specs mutate NVS and a shared boot lets one spec's
      #     residual state fail a later one (macro create/persist/delete), so each
      #     spec gets a clean boot here too. This DUT wires USB CDC fine on a stock
      #     runner (single machine), so it GATES.
      # Expand each `specs` token: a directory (tests/dya2) fans out to its
      # individual *.spec.ts, a file runs as-is — so tests/common/connect.spec.ts
      # and each tests/dya2/*.spec.ts each get a clean boot. NEVER pass multiple
      # specs to one invocation here.
      - name: Run WebSerial ⇄ Renode e2e (per-boot loop, one Studio connection per boot)
        if: ${{ matrix.dut.one_connection_per_boot }}
        working-directory: e2e/renode
        env:
          ZMK_WC_RENODE_LIB: ${{ github.workspace }}/zmk-west-commands/scripts/lib/renode
          DIST_DIR: ${{ github.workspace }}/dist
          DEVICE_NAME: ${{ matrix.dut.device }}
          RENODE_PLATFORM: ${{ matrix.dut.platform }}
          DYA2_PERIPHERAL_ELF: ${{ matrix.dut.peripheral_build != '' && format('{0}/fw-peripheral/zmk.elf', github.workspace) || '' }}
        run: |
          set -uo pipefail
          ELF="${{ github.workspace }}/fw/zmk.elf"
          rc=0
          for entry in ${{ matrix.dut.specs }}; do
            if [ -d "$entry" ]; then
              specs=$(ls "$entry"/*.spec.ts)
            else
              specs="$entry"
            fi
            for spec in $specs; do
              # Skip spec files with no active (non-fixme) test: booting Renode
              # (~1-2 min) only to run a fully-skipped file is pure waste
              # (tests/dya2/trackball.spec.ts is entirely test.fixme). Logged, not
              # a silent drop.
              if ! grep -qE '^[[:space:]]*test\(' "$spec"; then
                echo "::notice::skipping $spec (no active test — all fixme/skip)"
                continue
              fi
              ok=0
              for attempt in 1 2; do
                echo "::group::Renode boot for $spec (attempt $attempt)"
                if bash run-local.sh "$ELF" "$spec"; then
                  ok=1; echo "::endgroup::"; break
                fi
                echo "::endgroup::"
                echo "::warning::$spec failed on attempt $attempt"
              done
              [ "$ok" = 1 ] || rc=1
            done
          done
          exit "$rc"

      # Destructive specs (factory reset) wipe NVS, so they run in their OWN
      # fresh Renode boot AFTER the main specs — see the matrix `destructive_specs`
      # note. run-local.sh boots one Renode per invocation, so this is a clean
      # second boot with the same DUT ELF.
      - name: Run destructive specs (fresh Renode boot)
        if: matrix.dut.destructive_specs != ''
        working-directory: e2e/renode
        env:
          ZMK_WC_RENODE_LIB: ${{ github.workspace }}/zmk-west-commands/scripts/lib/renode
          DIST_DIR: ${{ github.workspace }}/dist
          DEVICE_NAME: ${{ matrix.dut.device }}
          RENODE_PLATFORM: ${{ matrix.dut.platform }}
          DYA2_PERIPHERAL_ELF: ${{ matrix.dut.peripheral_build != '' && format('{0}/fw-peripheral/zmk.elf', github.workspace) || '' }}
        run: bash run-local.sh "${{ github.workspace }}/fw/zmk.elf" ${{ matrix.dut.destructive_specs }}

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.dut.id }}
          path: |
            e2e/renode/playwright-report
            e2e/renode/test-results
            e2e/renode/renode_serve.err
            e2e/renode/bridge.out
          if-no-files-found: ignore
