name: Test and Build Web UI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Jobs override this only where preview deployment or PR comments require it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Check product specifications
        run: npm run spec:check
      - name: Check preview approval guards
        run: node --test scripts/preview-workflow.test.mjs
      - name: Run tests
        run: npm test
      - name: Build for Cloudflare Workers
        run: npm run build
        env:
          VITE_BASE: /
          # Dev and PR preview deployments keep RPC debug logging on; the
          # production release build (release.yml) leaves this unset.
          VITE_ENABLE_RPC_LOG: "true"
          # Header badge marking a non-production build: "PullRequest" for
          # pull-request preview deployments, "Dev" for the main-branch dev
          # deployment. The production release build (release.yml) leaves this
          # unset → no badge.
          VITE_BUILD_LABEL: ${{ github.event_name == 'pull_request' && 'PullRequest' || 'Dev' }}
          # Dev and PR preview builds talk to the staging Abyss deployment, not
          # production, so an experimental export never lands in the real
          # catalog. The production release build (release.yml) leaves this
          # unset and falls back to https://abyss.keyboard-hub.com.
          VITE_ABYSS_BASE_URL: https://keyboard-abyss.cormoran707.workers.dev
          # Keyboard Abyss OAuth client. Unset -> the Import/Export tab is not
          # registered at all. This must be a client registered on the *staging*
          # instance above: OAuth clients live in that deployment's own
          # database, so the production client id does not exist there.
          #
          # Note that pull-request previews get a fresh origin per commit, so
          # their redirect URI will not match a statically registered one unless
          # the OAuth client allows a pattern.
          VITE_ABYSS_CLIENT_ID: ${{ secrets.VITE_ABYSS_CLIENT_ID_DEV }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy-dev:
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    environment:
      name: preview-auto
      url: ${{ steps.deploy.outputs.deployment-url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Workers (dev)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env dev
          wranglerVersion: "4.58.0"
