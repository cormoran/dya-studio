name: Build Desktop App

# Desktop builds are sliced off the release that `release.yml` just published,
# so the tag must already exist before this workflow can attach installers to
# it. `release.yml` dispatches this workflow explicitly because GitHub does not
# start another workflow for release events created with `GITHUB_TOKEN`. The
# workflow definition comes from the default branch, while checkout uses the
# requested release tag so older releases can be rebuilt with the current CI.
#
# `workflow_dispatch` is kept so an installer-only build can be triggered
# manually. When `release_tag` is omitted, the attach job is skipped and the
# artifacts are still available for download.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to attach installers to
        required: false
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

  build:
    needs: validate
    strategy:
      matrix:
        include:
          - platform: macos-latest
            target: mac
            artifact_name: macos-installer
            artifact_path: release/*.dmg
          - platform: windows-latest
            target: win
            artifact_name: windows-installer
            artifact_path: release/*.exe
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build distribution
        run: npm run build:app && npx electron-builder --${{ matrix.target }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: inputs.release_tag != ''
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: "*-installer"
          merge-multiple: true

      - name: Attach installers to the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The release was already created (with --notes pointing at the in-app
          # release-notes page) by `.github/workflows/release.yml`; we only
          # upload the macOS .dmg and Windows .exe artifacts onto it.
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release/*.dmg \
            release/*.exe \
            --clobber
