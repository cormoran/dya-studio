name: Release DYA Studio

on:
  workflow_dispatch:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare-release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags so scripts/release.ts can resolve the next
          # increment and a rerun can recover the release commit.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci

      - name: Prepare release pull request branch
        id: release
        run: |
          RELEASE_BRANCH="release/run-${GITHUB_RUN_ID}"

          # Keep the branch until publishing finishes so rerunning this run
          # resumes the same version instead of creating a second release.
          if git ls-remote --exit-code --heads origin "refs/heads/$RELEASE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$RELEASE_BRANCH"
            git checkout --detach FETCH_HEAD
            VERSION=$(git log -1 --format=%s | sed -n 's/^chore(release): //p')
            if [ -z "$VERSION" ]; then
              echo "Could not recover the version from $RELEASE_BRANCH" >&2
              exit 1
            fi
          else
            # Promote `upcoming` to a dated version and prepend a new empty
            # `upcoming` section. The version is also printed to stdout.
            VERSION=$(GITHUB_OUTPUT= node scripts/release.ts)

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/i18n/releaseNotes.json
            git commit -m "chore(release): $VERSION"
            git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          fi

          echo "branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create draft release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          PR_URL=$(gh pr list \
            --state all \
            --head "$RELEASE_BRANCH" \
            --json url \
            --jq '.[0].url // empty')

          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --draft \
              --base main \
              --head "$RELEASE_BRANCH" \
              --title "chore(release): $VERSION" \
              --body "Automated release notes promotion for $VERSION. Mark this pull request ready for review, wait for the required build, review it, and merge it to publish the release.")
          fi

          echo "Release pull request: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Mark it ready for review to start the required pull-request CI." >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'release/run-')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare-release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        id: release
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          VERSION=${PR_TITLE#chore(release): }
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "Invalid release pull request title: $PR_TITLE" >&2
            exit 1
          fi

          NOTES_VERSION=$(node -e 'const fs = require("node:fs"); const data = JSON.parse(fs.readFileSync("src/i18n/releaseNotes.json", "utf8")); process.stdout.write(data.releases.find((release) => release.version !== "upcoming")?.version ?? "")')
          if [ "$NOTES_VERSION" != "$VERSION" ]; then
            echo "Release notes version $NOTES_VERSION does not match $VERSION" >&2
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "$MERGE_SHA" ]; then
            echo "Checked out commit does not match merged release commit $MERGE_SHA" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /
          VITE_GOOGLE_ANALYTICS_ID: ${{ secrets.VITE_GOOGLE_ANALYTICS_ID }}
          # Keyboard Abyss OAuth client, registered on the production instance.
          # Unset -> the Import/Export tab is not registered at all.
          # VITE_ABYSS_BASE_URL is deliberately unset here so the build falls
          # back to https://abyss.keyboard-hub.com; only dev/PR builds (test.yml)
          # point at the staging deployment.
          VITE_ABYSS_CLIENT_ID: ${{ secrets.VITE_ABYSS_CLIENT_ID }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_RELEASE }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_RELEASE }}
          environment: release
          wranglerVersion: "4.58.0"

      - name: Tag released commit
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "v$VERSION")
            if [ "$TAG_SHA" != "$MERGE_SHA" ]; then
              echo "v$VERSION already points to $TAG_SHA, expected $MERGE_SHA" >&2
              exit 1
            fi
          else
            git tag "v$VERSION" "$MERGE_SHA"
            git push origin "v$VERSION"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        # The release body just deep-links to the matching section of the
        # release notes page deployed above.
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" \
              --title "$VERSION" \
              --notes "Release notes: https://studio.dya.cormoran.works/release-notes#$VERSION"
          fi

      - name: Delete release branch
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$RELEASE_BRANCH" >/dev/null 2>&1; then
            git push origin --delete "$RELEASE_BRANCH"
          fi
